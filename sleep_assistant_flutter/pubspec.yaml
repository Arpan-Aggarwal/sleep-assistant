name: sleep_assistant
description: AI-Powered Night-Time Sleep Assistant
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Screen usage tracking
  app_usage: ^4.1.0

  # Audio
  audioplayers: ^6.0.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # HTTP
  http: ^1.2.0

  # Local storage
  shared_preferences: ^2.2.2

  # Background service
  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^17.0.0

  # UI
  google_fonts: ^6.1.0
  animated_text_kit: ^4.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"  # your icon file
  min_sdk_android: 21
flutter:
  uses-material-design: true
  assets:
    - assets/audio/new_rain.mp3
    - assets/audio/rain.mp3
    - assets/audio/white_noise.mp3
    - assets/audio/sleep_music.mp3
    - assets/audio/piano.mp3
    - assets/audio/etherial_light.mp3
    - assets/audio/silent_valley.mp3