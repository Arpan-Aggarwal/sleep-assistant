name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git openjdk-17-jdk zip unzip libffi-dev libssl-dev autoconf libtool pkg-config cmake libltdl-dev ccache
        echo "Dependencies installed"

    - name: Set Java 17
      run: |
        echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
        echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH
        java -version

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer==1.5.0
        pip install cython==0.29.33
        pip install virtualenv
        buildozer --version

    - name: Create buildozer spec
      run: |
        echo "[app]" > buildozer.spec
        echo "title = Sleep Assistant" >> buildozer.spec
        echo "package.name = sleepassistant" >> buildozer.spec
        echo "package.domain = org.sleepapp" >> buildozer.spec
        echo "source.dir = ." >> buildozer.spec
        echo "source.include_exts = py,png,jpg,kv,json" >> buildozer.spec
        echo "source.exclude_dirs = tests,bin,venv,server,cloud_functions,.git,data,.buildozer" >> buildozer.spec
        echo "version = 1.0" >> buildozer.spec
        echo "requirements = python3,kivy==2.3.0,requests,urllib3" >> buildozer.spec
        echo "orientation = portrait" >> buildozer.spec
        echo "fullscreen = 0" >> buildozer.spec
        echo "android.permissions = INTERNET,FOREGROUND_SERVICE,PACKAGE_USAGE_STATS,POST_NOTIFICATIONS,RECEIVE_BOOT_COMPLETED,WAKE_LOCK" >> buildozer.spec
        echo "android.api = 33" >> buildozer.spec
        echo "android.minapi = 26" >> buildozer.spec
        echo "android.ndk = 25b" >> buildozer.spec
        echo "android.sdk = 33" >> buildozer.spec
        echo "android.accept_sdk_license = True" >> buildozer.spec
        echo "android.archs = arm64-v8a" >> buildozer.spec
        echo "android.enable_androidx = True" >> buildozer.spec
        echo "services = SleepTrackerService:services/background.py:foreground" >> buildozer.spec
        echo "[buildozer]" >> buildozer.spec
        echo "log_level = 2" >> buildozer.spec
        echo "warn_on_root = 1" >> buildozer.spec
        cat buildozer.spec

    - name: Setup Android licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
        echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo "Licenses accepted"

    - name: Set Gradle memory
      run: |
        mkdir -p ~/.gradle
        echo "org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m" > ~/.gradle/gradle.properties
        echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
        echo "Gradle memory configured"

    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          ~/.gradle
        key: buildozer-v3-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-v3-

    - name: Build APK
      run: |
        buildozer -v android debug 2>&1

    - name: Show logs on failure
      if: failure()
      run: |
        echo "=== Build errors ==="
        grep -r "ERROR\|FAILED\|error:" .buildozer/ 2>/dev/null | grep -v ".pyc" | tail -30 || echo "no errors found in logs"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: sleep-assistant-apk
        path: bin/*.apk
        if-no-files-found: error

    - name: APK info
      if: success()
      run: |
        ls -la bin/
        echo "APK ready"
