name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          openjdk-17-jdk \
          zip \
          unzip \
          libffi-dev \
          libssl-dev \
          autoconf \
          libtool \
          pkg-config \
          cmake \
          libltdl-dev \
          ccache \
          libgstreamer1.0-dev \
          gstreamer1.0-plugins-base
        echo "Dependencies installed"

    - name: Set Java 17
      run: |
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
        echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH
        java -version

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer==1.5.0
        pip install cython==0.29.33
        pip install virtualenv
        buildozer --version

    - name: Create buildozer spec
      run: |
        cat > buildozer.spec << 'SPEC'
[app]
title = Sleep Assistant
package.name = sleepassistant
package.domain = org.sleepapp
source.dir = .
source.include_exts = py,png,jpg,kv,json
source.exclude_dirs = tests,bin,venv,server,cloud_functions,.git,data,.buildozer
version = 1.0
requirements = python3,kivy==2.3.0,requests,urllib3
orientation = portrait
fullscreen = 0
android.permissions = INTERNET,FOREGROUND_SERVICE,PACKAGE_USAGE_STATS,POST_NOTIFICATIONS,RECEIVE_BOOT_COMPLETED,WAKE_LOCK
android.api = 33
android.minapi = 26
android.ndk = 25b
android.sdk = 33
android.accept_sdk_license = True
android.archs = arm64-v8a
android.gradle_dependencies = com.android.support:appcompat-v7:28.0.0
android.enable_androidx = True
services = SleepTrackerService:services/background.py:foreground
[buildozer]
log_level = 2
warn_on_root = 1
SPEC
        echo "buildozer.spec created"
        cat buildozer.spec

    - name: Setup Android licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
        echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > \
          $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> \
          $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> \
          $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo "Licenses accepted"

    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          ~/.gradle
        key: buildozer-v2-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-v2-

    - name: Set Gradle memory
      run: |
        mkdir -p ~/.gradle
        echo "org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m" \
          > ~/.gradle/gradle.properties
        echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
        echo "Gradle memory set"

    - name: Build APK
      run: |
        buildozer -v android debug 2>&1

    - name: Show build log on failure
      if: failure()
      run: |
        echo "=== Gradle log ==="
        find . -name "*.log" -path "*/gradle/*" 2>/dev/null \
          | head -3 | xargs tail -50 2>/dev/null
        echo "=== Buildozer log ==="
        find . -name "buildozer.log" 2>/dev/null \
          | xargs tail -80 2>/dev/null
        echo "=== Last build errors ==="
        grep -r "ERROR\|FAILED\|error:" \
          .buildozer/android/platform/build-arm64-v8a/dists/ \
          2>/dev/null | tail -30

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: sleep-assistant-apk
        path: bin/*.apk
        if-no-files-found: error

    - name: APK info
      if: success()
      run: |
        ls -la bin/
        echo "APK ready to download"